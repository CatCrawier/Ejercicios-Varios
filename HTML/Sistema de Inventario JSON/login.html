<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Sistema de Inventario</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">

<div class="contenedor-auth">

    <div class="auth-brand">
        <span class="auth-icon">📦</span>
        <h1>Sistema de Inventario</h1>
        <p>Bienvenido de nuevo</p>
    </div>

    <h2 class="auth-section-title">Iniciar sesión</h2>

    <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="usuario@correo.com" autocomplete="email">
    </div>

    <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <p id="errorLogin" class="error-msg" style="display:none;"></p>

    <button id="btnLogin" class="btn btn-full">Ingresar</button>

    <p class="forgot-link"><a href="recuperar.html">¿Olvidaste tu contraseña?</a></p>

    <div class="auth-divider">Crear cuenta nueva</div>

    <h2 class="auth-section-title">Registrarse</h2>

    <div class="form-group">
        <label for="registerEmail">Correo electrónico</label>
        <input type="email" id="registerEmail" placeholder="usuario@correo.com" autocomplete="email">
    </div>

    <div class="form-group">
        <label for="registerPassword">Contraseña</label>
        <input type="password" id="registerPassword" placeholder="Min. 8: Aa, 123 y signo" autocomplete="new-password">
    </div>

    <p id="errorRegister" class="error-msg" style="display:none;"></p>

    <button id="btnRegister" class="btn btn-full">Registrarse</button>

</div>

<script type="module" src="js/auth.js"></script>
</body>
</html>
