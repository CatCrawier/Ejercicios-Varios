<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña — Sistema de Inventario</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">

<div class="contenedor-auth">

    <div class="auth-brand">
        <span class="auth-icon">🔑</span>
        <h1>Recuperar contraseña</h1>
        <p>Te enviaremos un enlace a tu correo</p>
    </div>

    <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="usuario@correo.com" autocomplete="email">
    </div>

    <p id="errorRecuperar" class="error-msg" style="display:none;"></p>
    <p id="successRecuperar" class="success-msg" style="display:none;"></p>

    <button id="btnRecuperar" class="btn btn-full">Enviar enlace</button>

    <p class="forgot-link" style="margin-top:16px;">
        <a href="login.html">← Volver al inicio de sesión</a>
    </p>

</div>

<script type="module" src="js/recuperar.js"></script>
</body>
</html>
