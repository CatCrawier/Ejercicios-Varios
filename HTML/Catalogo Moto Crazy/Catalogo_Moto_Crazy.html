<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="author" content="Adrian Vasquez Perez">
  <title>Moto Crazy — Catálogo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Catalogo_Moto_Crazy.css">
</head>
<body>

<header>
  <div class="logo">MOTO <span>CRAZY</span></div>
  <div class="contador-cabecera" id="contadorCabecera">Cargando...</div>
</header>

<section class="seccion-hero">
  <h1>CATÁLOGO <span>DE MOTOS</span></h1>
  <p>Explora nuestra colección: deportivas, sin carenado y turismo</p>
</section>

<div class="barra-filtros">
  <span class="etiqueta-filtros">Filtrar por:</span>
  <button class="btn-filtro activo" data-categoria="todas" onclick="establecerFiltro('todas')">Todas</button>
</div>

<main>
  <div class="cuadricula-catalogo" id="cuadriculaCatalogo">
    <div class="tarjeta-esqueleto"><div class="imagen-esqueleto"></div><div class="cuerpo-esqueleto"><div class="linea-esqueleto ancho40"></div><div class="linea-esqueleto ancho60"></div></div></div>
    <div class="tarjeta-esqueleto"><div class="imagen-esqueleto"></div><div class="cuerpo-esqueleto"><div class="linea-esqueleto ancho40"></div><div class="linea-esqueleto ancho60"></div></div></div>
    <div class="tarjeta-esqueleto"><div class="imagen-esqueleto"></div><div class="cuerpo-esqueleto"><div class="linea-esqueleto ancho40"></div><div class="linea-esqueleto ancho60"></div></div></div>
    <div class="tarjeta-esqueleto"><div class="imagen-esqueleto"></div><div class="cuerpo-esqueleto"><div class="linea-esqueleto ancho40"></div><div class="linea-esqueleto ancho60"></div></div></div>
    <div class="tarjeta-esqueleto"><div class="imagen-esqueleto"></div><div class="cuerpo-esqueleto"><div class="linea-esqueleto ancho40"></div><div class="linea-esqueleto ancho60"></div></div></div>
    <div class="tarjeta-esqueleto"><div class="imagen-esqueleto"></div><div class="cuerpo-esqueleto"><div class="linea-esqueleto ancho40"></div><div class="linea-esqueleto ancho60"></div></div></div>
    <div class="tarjeta-esqueleto"><div class="imagen-esqueleto"></div><div class="cuerpo-esqueleto"><div class="linea-esqueleto ancho40"></div><div class="linea-esqueleto ancho60"></div></div></div>
    <div class="tarjeta-esqueleto"><div class="imagen-esqueleto"></div><div class="cuerpo-esqueleto"><div class="linea-esqueleto ancho40"></div><div class="linea-esqueleto ancho60"></div></div></div>
  </div>

  <div class="contenedor-cargar-mas" id="contenedorCargarMas" style="display:none;">
    <button class="btn-cargar-mas" id="botonCargarMas" onclick="cargarMas()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
      </svg>
      MÁS PRODUCTOS
    </button>
    <span class="info-cargar-mas" id="infoCargarMas"></span>
  </div>
</main>

<script type="module" src="Catalogo_Moto_Crazy.js"></script>
</body>
</html>
